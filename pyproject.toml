[project]
name = "transpilot-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.0,<3",
  "email-validator>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
]

[tool.vercel]
entrypoint = "api/index.py"
